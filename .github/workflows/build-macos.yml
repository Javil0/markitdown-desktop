name: Pruebas y app de macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pruebas
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Icono
        run: |
          python packaging/make_icon.py packaging/icon.png
          mkdir -p packaging/MarkItDown.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icon.png --out packaging/MarkItDown.iconset/icon_${s}x${s}.png
            d=$((s*2)); sips -z $d $d packaging/icon.png --out packaging/MarkItDown.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns packaging/MarkItDown.iconset -o packaging/MarkItDown.icns
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Empaquetar MarkItDown.app
        run: pyinstaller packaging/MarkItDown.spec --noconfirm

      - name: Probar la app empaquetada
        run: |
          echo '<h1>Prueba</h1><p>Hola</p>' > /tmp/prueba.html
          ./dist/MarkItDown.app/Contents/MacOS/MarkItDown --selftest /tmp/prueba.html | grep "# Prueba"

      - name: Crear .dmg
        run: |
          codesign --force --deep --sign - dist/MarkItDown.app
          mkdir dmg && cp -R dist/MarkItDown.app dmg/ && ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname MarkItDown -srcfolder dmg -ov -format UDZO MarkItDown-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-macOS
          path: MarkItDown-macOS.dmg

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MarkItDown-macOS.dmg
