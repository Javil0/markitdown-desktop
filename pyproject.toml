[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markitdown-desktop"
version = "0.1.0"
description = "App de escritorio para macOS: arrastra archivos y conviértelos a Markdown con MarkItDown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]>=0.1.2",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "python-docx>=1.1", "pyinstaller>=6.6"]

[project.gui-scripts]
markitdown-desktop = "markitdown_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
